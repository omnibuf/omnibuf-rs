[package]
name = "omnibuf"
description = "Core runtime, wire primitives, blind decoder, opaque splicing, and prost bridge for OmniBuf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["derive", "prost"]
derive = ["dep:omnibuf-derive"]
prost = ["dep:prost", "dep:prost-reflect", "dep:prost-types"]

[dependencies]
itoa.workspace = true
omnibuf-derive = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
ryu.workspace = true
