[workspace]
resolver = "2"
members = [
    "crates/omnibuf",
    "crates/omnibuf-derive",
    "crates/protoc-gen-omnibuf-rs",
    "crates/conformance-rs",
    "crates/omnibuf-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["OmniBuf Contributors"]

[workspace.dependencies]
omnibuf = { path = "crates/omnibuf", version = "0.1.0" }
omnibuf-derive = { path = "crates/omnibuf-derive", version = "0.1.0" }
protoc-gen-omnibuf-rs = { path = "crates/protoc-gen-omnibuf-rs", version = "0.1.0" }
itoa = "1.0"
proc-macro2 = "1.0"
prost = "0.13"
prost-build = "0.13"
prost-reflect = { version = "0.14", features = ["derive"] }
prost-reflect-build = "0.14"
prost-types = "0.13"
quote = "1.0"
rmp-serde = "1.3"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
