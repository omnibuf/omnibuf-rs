[workspace]
resolver = "2"
members = [
    "crates/omnibuf",
    "crates/omnibuf-derive",
    "crates/omnibuf-tonic",
    "crates/protoc-gen-omnibuf-rs",
    "crates/conformance-rs",
    "crates/omnibuf-bench",
]

[workspace.package]
version = "0.1.13"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["OmniBuf Contributors"]
repository = "https://github.com/omnibuf/omnibuf-rs"
homepage = "https://omnibuf.com/rs"

[workspace.dependencies]
omnibuf = { path = "crates/omnibuf", version = "0.1.13" }
omnibuf-derive = { path = "crates/omnibuf-derive", version = "0.1.13" }
protoc-gen-omnibuf-rs = { path = "crates/protoc-gen-omnibuf-rs", version = "0.1.13" }
buffa = "0.9"
buffa-build = "0.9"
buffa-descriptor = { version = "0.9", features = ["reflect", "std"] }
itoa = "1.0"
proc-macro2 = "1.0"
prost = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }
prost-reflect-build = "0.16"
prost-types = "0.14"
quote = "1.0"
rmp-serde = "1.3"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "3.0", features = ["full"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
